name: CI

on:
  push:
    branches: [master]
  # Include dependent PR bases so stacked changes receive the same checks.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  database:
    name: Database regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create local API roles
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$TEST_POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1
          -c 'create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;'
      - name: Check ingestion and refresh migrations
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/test-ingestion-db.mjs

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Placeholder values so the build can statically analyze pages.
          # No network calls are made against these at build time.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
