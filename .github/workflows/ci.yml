name: CI

on:
  push:
    branches: [master]
  # Include dependent PR bases so stacked changes receive the same checks.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated database and apply all migrations
        run: pnpm test:e2e:setup
      - name: Desktop and mobile persistence
        run: pnpm test:e2e
      - name: Database ranking regression and query plan
        run: node scripts/test-ranking-db.mjs
        env:
          TEST_POSTGRES_CONTAINER: supabase_db_paper-deck-e2e
      - name: Failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Placeholder values so the build can statically analyze pages.
          # No network calls are made against these at build time.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
